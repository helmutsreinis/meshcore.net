---
name: Create Release

on:
  push:
    tags:
      # Trigger on version tags like v1.0.0, v2.1.3, etc.
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Pack NuGet package
        run: |
          dotnet pack meshcore-lib/meshcore-lib.csproj \
            --configuration Release --no-build --output ./artifacts

      - name: Extract version from tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # Meshcore.NET Release ${{ steps.get_version.outputs.VERSION }}

          ## What's New

          This release includes the Meshcore.NET library for .NET 9.0.

          ## Installation

          ### NuGet Package
          ```bash
          dotnet add package Meshcore.NET
          ```

          ### Manual Installation
          Download the artifacts below and add a project reference.

          ## Requirements
          - .NET 9.0 SDK or higher
          - A Meshcore-compatible device

          ## Documentation
          - [README](https://github.com/helmutsreinis/meshcore.net)
          - [API Reference](https://github.com/helmutsreinis/meshcore.net)
          - [PowerShell Examples](https://github.com/helmutsreinis/meshcore.net)
          - [Documentation](https://github.com/helmutsreinis/meshcore.net)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            artifacts/*.nupkg
            meshcore-lib/bin/Release/net9.0/meshcore-lib.dll
            meshcore-lib/bin/Debug/net9.0/meshcore-lib.dll
          token: ${{ secrets.GITHUB_TOKEN }}
